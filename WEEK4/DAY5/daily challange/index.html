<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random GIF Search</title>
</head>
<body>

    <h1>Random GIF Search</h1>

    <form id="gifForm">
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Enter a category (e.g., sun)" 
            required 
        >
        <button type="submit">SEARCH</button>
    </form>

    <button id="deleteAll">DELETE ALL</button>

    <div id="gifsContainer"></div>

    <script src="script.js"></script>
</body>
</html>
