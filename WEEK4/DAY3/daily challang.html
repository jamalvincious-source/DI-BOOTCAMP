<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Challenge: HTML Form</title>
</head>
<body>

    <!-- 1. Form with two fields and a submit button -->
    <form id="userForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" required><br><br>

        <button type="submit" id="sendBtn">Send</button>
    </form>

    <!-- Container where the JSON string will be appended -->
    <div id="output"></div>

    <script>
        const form = document.getElementById('userForm');
        
        form.addEventListener('submit', function(event) {
            // Prevent the default form submission page reload
            event.preventDefault();

            // Retrieve data from inputs
            const firstName = document.getElementById('name').value;
            const lastName = document.getElementById('lastname').value;

            // Create an object with the data
            const dataObj = {
                name: firstName,
                lastname: lastName
            };

            // Convert the object into a JSON string
            const jsonString = JSON.stringify(dataObj);

            // Append it to the DOM (inside the output div)
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = jsonString;
        });
    </script>

</body>
</html>
