databases:
  - name: global-network-kenya-db
    databaseName: global_network_kenya
    user: gnk_user
    plan: basic-256mb

services:
  - type: web
    name: global-network-kenya-api
    runtime: node
    plan: free
    rootDir: Desktop/BEST PROJECT 2026-2027/GLOBAL KENYA NETWORK
    buildCommand: npm ci --include=dev && npm run prisma:generate
    startCommand: npm run db:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: global-network-kenya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: global-network-kenya-site
    runtime: static
    rootDir: Desktop/BEST PROJECT 2026-2027/GLOBAL KENYA NETWORK
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: global-network-kenya-api
          property: host
