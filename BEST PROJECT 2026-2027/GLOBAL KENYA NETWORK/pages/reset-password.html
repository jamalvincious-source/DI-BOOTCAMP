<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | Global Network Kenya</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="auth-container">
      <section class="auth-card">
        <h1>Set a new password</h1>
        <p>Choose a password with at least 8 characters. Reset links expire after 30 minutes.</p>
        <p id="resetMessage" role="status" aria-live="polite"></p>
        <form id="resetForm">
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
          </div>
          <button class="btn" type="submit">Reset password</button>
        </form>
        <a href="login.html">Return to sign in</a>
      </section>
    </main>
    <script src="../js/app.js"></script>
    <script>
      const resetForm = document.getElementById("resetForm");
      const resetMessage = document.getElementById("resetMessage");
      const resetToken = new URLSearchParams(location.search).get("token");

      if (!resetToken) {
        resetMessage.textContent = "This reset link is incomplete. Request a new one from the sign-in page.";
        resetForm.hidden = true;
      }

      resetForm.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmPassword").value;
        if (password !== confirmation) {
          resetMessage.textContent = "The passwords do not match.";
          return;
        }

        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        resetMessage.textContent = "";
        try {
          const result = await window.GNK.apiRequest("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ token: resetToken, password })
          });
          resetMessage.textContent = result.message;
          resetMessage.className = "message success";
          resetForm.reset();
          resetForm.hidden = true;
        } catch (error) {
          resetMessage.textContent = error.message || "Unable to reset your password.";
          resetMessage.className = "message error";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
